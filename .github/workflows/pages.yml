name: Refresh NFL research desk

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
    # Bovada game-line checks (UTC; Central Time is UTC-5 until Nov 1, then UTC-6).
    # Game lines only, about 3 credits each: ~17 runs and ~52 credits a month.
    - cron: '23 15 * * 2'   # Tuesday mid-morning: new week's lines
    - cron: '23 21 * * 4'   # Thursday afternoon: before Thursday night
    - cron: '23 15 * * 6'   # Saturday mid-morning
    - cron: '23 15 * * 0'   # Sunday ~10 AM CT: before the early games
  workflow_dispatch:
    inputs:
      fetch_live_odds:
        description: 'Fetch Bovada prices from The Odds API for this manual run'
        type: boolean
        default: false
      include_player_props:
        description: 'Fetch every listed full-game player prop (may require many credits)'
        type: boolean
        default: false
      credit_limit:
        description: 'Maximum API credits allowed for this run (3–1000)'
        type: string
        default: '10'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fourth-down-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/nfl_scoring_requirements.txt
      - name: Install paper model dependencies
        run: python3 -m pip install -r scripts/nfl_scoring_requirements.txt
      - name: Test scoring and source adapters
        run: python3 -m unittest discover -s tests
      - name: Decide whether this run checks Bovada odds
        id: odds
        # Paid odds are fetched only on a manual run with the box checked or on
        # one of the four game-line schedules above. The hourly run never calls it.
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL: ${{ inputs.fetch_live_odds }}
          MANUAL_LIMIT: ${{ inputs.credit_limit }}
          MANUAL_PROPS: ${{ inputs.include_player_props }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$MANUAL" = "true" ]; then
            echo "fetch=true" >> "$GITHUB_OUTPUT"
            echo "limit=$MANUAL_LIMIT" >> "$GITHUB_OUTPUT"
            echo "props=$MANUAL_PROPS" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" != "17 * * * *" ]; then
            echo "fetch=true" >> "$GITHUB_OUTPUT"
            echo "limit=5" >> "$GITHUB_OUTPUT"
            echo "props=false" >> "$GITHUB_OUTPUT"
          else
            echo "fetch=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch Bovada odds (capped)
        if: steps.odds.outputs.fetch == 'true'
        # A failed scheduled check keeps the last prices and still publishes.
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          ODDS_API_CREDIT_LIMIT: ${{ steps.odds.outputs.limit }}
          ODDS_API_INCLUDE_PROPS: ${{ steps.odds.outputs.props }}
        run: python3 scripts/the_odds_api.py
      - name: Collect free NFL research
        run: python3 scripts/free_sources.py
      - name: Update team-game history and refit market model
        # A data hiccup here must not block publishing; the pipeline falls
        # back to the last committed model files.
        continue-on-error: true
        # Free nflverse data only. Re-runs the walk-forward backtest, so the
        # pick gate always reflects the parameters in data/model/config.json.
        run: |
          python3 scripts/history_data.py current
          python3 scripts/market_model.py all
      - name: Build verified public feed
        env:
          ODDS_FEED_FILE: ${{ steps.odds.outputs.fetch == 'true' && 'data/the_odds_api_feed.json' || '' }}
          ODDS_FEED_URL: ${{ vars.ODDS_FEED_URL }}
          ODDS_FEED_TOKEN: ${{ secrets.ODDS_FEED_TOKEN }}
          INJURIES_FEED_URL: ${{ vars.INJURIES_FEED_URL }}
          INJURIES_FEED_TOKEN: ${{ secrets.INJURIES_FEED_TOKEN }}
          NEWS_FEED_URL: ${{ vars.NEWS_FEED_URL }}
          NEWS_FEED_TOKEN: ${{ secrets.NEWS_FEED_TOKEN }}
          WEATHER_FEED_URL: ${{ vars.WEATHER_FEED_URL }}
          WEATHER_FEED_TOKEN: ${{ secrets.WEATHER_FEED_TOKEN }}
          TRAVEL_FEED_URL: ${{ vars.TRAVEL_FEED_URL }}
          STATS_FEED_URL: ${{ vars.STATS_FEED_URL }}
          HISTORICAL_FEED_URL: ${{ vars.HISTORICAL_FEED_URL }}
        run: python3 scripts/pipeline.py
      - name: Freeze paper forecasts and evaluate settled predictions
        run: python3 scripts/paper_tracking.py
      - name: Preserve public snapshot and free source checks
        run: |
          git config user.name 'fourth-down-bot'
          git config user.email 'fourth-down-bot@users.noreply.github.com'
          git add data/dashboard.json data/free data/model
          if [ -d data/paper ]; then git add data/paper; fi
          if [ -f data/state.json ]; then git add data/state.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh NFL public research [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - uses: actions/configure-pages@v5
      - name: Stage public dashboard files
        run: python3 scripts/stage_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

